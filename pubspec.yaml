name: runbike_app
description: "ランバイク練習・タイム計測アプリ"
publish_to: 'none'
version: 1.1.0+15

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  audioplayers: ^6.1.0
  intl: ^0.20.2
  camera: ^0.11.1
  path_provider: ^2.1.5
  flutter_launcher_icons: ^0.14.3
  sqflite: ^2.4.2
  gal: ^2.3.1
  wakelock_plus: ^1.2.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#0F1512"
  adaptive_icon_foreground: "assets/app_icon_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
  fonts:
    - family: Noto Sans JP
      fonts:
        - asset: assets/fonts/NotoSansJP-VariableFont_wght.ttf
    # タイム表示・英字見出し用の細身の斜体フォント（SIL OFLライセンス）
    - family: Barlow Condensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BarlowCondensed-Bold.ttf
          weight: 700
        - asset: assets/fonts/BarlowCondensed-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/BarlowCondensed-ExtraBoldItalic.ttf
          weight: 800
          style: italic

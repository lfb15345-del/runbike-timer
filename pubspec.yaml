name: runbike_app
description: "ランバイク練習・タイム計測アプリ"
publish_to: 'none'
version: 1.2.2+22

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  # アプリ内の標準部品（コピー・貼り付け等）を日本語で表示する
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  audioplayers: ^6.1.0
  intl: ^0.20.2
  camera: ^0.11.1
  path_provider: ^2.1.5
  flutter_launcher_icons: ^0.14.3
  sqflite: ^2.4.2
  gal: ^2.3.1
  wakelock_plus: ^1.2.10
  # 自己ベスト更新時に App Store の評価をお願いする（Apple標準の小窓）
  in_app_review: ^2.0.12
  # 「評価のお願いをいつ出したか」を覚えておく
  shared_preferences: ^2.5.6
  # 記録をLINE・Instagramなどにシェアする（OS標準のシェア画面）
  share_plus: ^13.0.0  # 12系は win32 を古くして wakelock_plus のビルドが壊れるため13系

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#0F1512"
  adaptive_icon_foreground: "assets/app_icon_foreground.png"

flutter:
  uses-material-design: true
  # 多言語化（lib/l10n/*.arb から翻訳クラスを自動生成する）
  generate: true
  assets:
    - assets/sounds/
  fonts:
    - family: Noto Sans JP
      fonts:
        - asset: assets/fonts/NotoSansJP-VariableFont_wght.ttf
    # タイム表示・英字見出し用の細身の斜体フォント（SIL OFLライセンス）
    - family: Barlow Condensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BarlowCondensed-Bold.ttf
          weight: 700
        - asset: assets/fonts/BarlowCondensed-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/BarlowCondensed-ExtraBoldItalic.ttf
          weight: 800
          style: italic
